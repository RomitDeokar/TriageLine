team: "TriageLine"
entry_point: "livekit_agent/cascaded_agent.py"   # custom LiveKit agent: Silero VAD -> STT -> ParticipantAgent (rules first) -> TTS
reproduce: "PYTHON=python3.12 ./run_fdb_v3.sh --require-judge"   # fails on runner error, non-'completed' / missing / stale results, unjudged items, failed speech preflight
provider_name: "triageline"
python: "3.12"                                     # 3.10-3.12 enforced by the script (NeMo ASR used by the official runner)
requirements: "requirements-fdb.txt"
fdb_commit: "3e799c45a045256f47d5f1c9cda90157e2d2ec9e"
worker_mode: "TRIAGELINE_MODE=benchmark (pinned by run_fdb_v3.sh)"

scored_configuration:                              # exactly what run_fdb_v3.sh pins (also written to results/<stamp>/run_config.json)
  llm_planner: "OFF (TRIAGELINE_LLM_PLANNER=0). Rules-only ParticipantAgent: deterministic given the transcript."
  llm_mode: "fallback (rules first)"
  vad: "Silero + livekit-plugins-turn-detector (weights fetched by `python -m livekit.agents download-files`)"
  stt: "auto: Deepgram nova-3 (streaming) if DEEPGRAM_API_KEY, else Gemini gemini-3.5-flash-lite"
  tts: "auto: Deepgram aura-2 if DEEPGRAM_API_KEY, else Gemini gemini-3.8-flash-lite-tts"
  commit_gate: "TRIAGELINE_SETTLE_S=1.0 / TRIAGELINE_MAX_SETTLE_S=2.0"
  judge: "official evaluators, OpenAI gpt-4o (coverage asserted by scripts/judge_coverage.py)"

extension:
  name: "Triage Line - roadside / incident triage"
  entry_point: "livekit_agent/triage_livekit_agent.py (brain: livekit_agent/triage_brain.py + legacy/core/)"
  how_to_run: "TRIAGELINE_AGENT_NAME=triageline-triage python livekit_agent/triage_livekit_agent.py dev; gateway with TRIAGELINE_TRIAGE_AGENT_NAME=triageline-triage; open /rtc.html?flow=triage"
  behaviour: "deliberates before any consequential action; two-phase commit (PROPOSED -> PENDING_CONFIRMATION -> FINALIZED/ABORTED); corrections abort stale proposals; nothing finalizes without an explicit yes"
  actions: "SIMULATED (in-memory dispatch log)"

supporting:
  phone_assistant: "Same worker with TRIAGELINE_MODE=assistant via /rtc.html (flow=assistant); LLM chain gemini -> cerebras -> openrouter -> mistral, T=0, seed 7, schema-validated, confirmation before state changes"

# Every number states its mode. Only the live judged run is the scored benchmark result.
reported_scores:
  live_livekit_exact_match: "FINAL 2026-10-01 (pinned config, planner off, judge off, 99/100 turn-taken): strict pass 28/100, tool-selection 80.6%, argument accuracy 39.7%, avg latency 5.82s. Run dir results/live_20260930T200524Z/. Run #1 was 13/100; the gain came from the live-audio fixes. Exact match is a harsh lower bound; the organisers re-run with their pinned judge."
  live_livekit_judged: "not run - no OPENAI_API_KEY available (organisers confirmed teams cannot be given keys/credits; official judged scores come from the organisers' common re-run)"
  offline_text_replay_diagnostic: "91/100 strict (official evaluator, judge off, exact match = lower bound); see results/results.md"
  independent_heldout_rules_only: "29/30 (96.7%) scenarios_heldout/heldout_v1.json via scripts/heldout_eval.py"
integrity:
  audit: "python3 scripts/integrity_audit.py --strict-comments -> PASS (decision code, comments, docstrings, test fixtures)"
  note: "Before 2026-09-29 the audit parsed 0 utterances (wrong metadata field), so its earlier PASS was vacuous; fixed. Rules were developed against the public set, so the text replay is optimistic; the held-out set was never used to tune rules."
