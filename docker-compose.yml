# Local/pilot deployment: gateway + assistant voice worker on one LiveKit project.
#   cp .env.example .env   # fill in LiveKit + one LLM/speech key
#   docker compose up --build
# Put a TLS reverse proxy (Caddy/nginx/Cloud load balancer) in front of :8080 for phones.
services:
  api:
    build: { context: ., target: api }
    env_file: .env
    environment:
      TRIAGELINE_AGENT_NAME: ${TRIAGELINE_AGENT_NAME:-triageline-assistant}
    ports: ["8080:8080"]
    restart: unless-stopped
  worker:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      TRIAGELINE_MODE: assistant
      TRIAGELINE_AGENT_NAME: ${TRIAGELINE_AGENT_NAME:-triageline-assistant}
    restart: unless-stopped

  # Extension (Theme 05 "Triage Line"): the incident-triage call flow on the same agent shell.
  triage-worker:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      TRIAGELINE_MODE: triage
      TRIAGELINE_AGENT_NAME: ${TRIAGELINE_TRIAGE_AGENT_NAME:-triageline-triage}
    command: ["python", "livekit_agent/triage_livekit_agent.py", "start"]
    restart: unless-stopped
