name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-app.txt -r requirements-fdb.txt pytest httpx pyflakes
      - run: python -m pytest tests livekit_agent/adapter_tests -q
      - run: python scripts/integrity_audit.py
      - run: python scripts/heldout_eval.py
      - run: bash tests/shell/test_run_fdb_v3_failures.sh
  js:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npm test && npm run build && git diff --exit-code static/rtc.bundle.js
